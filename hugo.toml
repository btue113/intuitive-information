baseURL = "https://tuebui.com/"
locale = "en-US"
title = "Intuitive Information"
buildFuture = true
titleCaseStyle = "none"
enableRobotsTXT = true

[params]
  description = "Information theory, drawn instead of derived."
  author = "Tue Bui"
  emailUser = "contact"
  emailDomain = "tuebui.com"
  questions = "https://github.com/btue113/ECC-HyperCube/discussions/categories/q-a"

[taxonomies]
  tag = "tags"
  series = "series"

[permalinks.page]
  posts = "/:year/:month/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[[module.mounts]]
  source = "posts"
  target = "content/posts"
  files = ["! **/source/**"]

[[module.mounts]]
  source = "static"
  target = "static"
