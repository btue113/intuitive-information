baseURL = "https://tuebui.com/"
locale = "en-US"
title = "Tue Bui"
buildFuture = true
titleCaseStyle = "none"
enableRobotsTXT = true

[params]
  description = "Tue Bui: software engineer. Notes, code, and Intuitive Information, a blog that explains information theory with pictures."
  author = "Tue Bui"
  emailUser = "contact"
  emailDomain = "tuebui.com"
  questions = "https://github.com/btue113/ECC-HyperCube/discussions/categories/q-a"

[taxonomies]
  tag = "tags"
  series = "series"

[permalinks.page]
  intuitive-information = "/intuitive-information/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[[module.mounts]]
  source = "content"
  target = "content"

# The blog's posts live in posts/ and make up the Intuitive Information section.
[[module.mounts]]
  source = "posts"
  target = "content/intuitive-information"
  files = ["! **/source/**"]

[[module.mounts]]
  source = "static"
  target = "static"
