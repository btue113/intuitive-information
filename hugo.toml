baseURL = "https://btue113.github.io/intuitive-information/"
locale = "en-US"
title = "Intuitive Information"
buildFuture = true
titleCaseStyle = "none"
enableRobotsTXT = true

[params]
  description = "Information theory, drawn instead of derived."
  author = "Tue Bui"

[taxonomies]
  tag = "tags"
  series = "series"

[permalinks.page]
  posts = "/:year/:month/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[[module.mounts]]
  source = "posts"
  target = "content/posts"
  files = ["! **/source/**"]

[[module.mounts]]
  source = "static"
  target = "static"
