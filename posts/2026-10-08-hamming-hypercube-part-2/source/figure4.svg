t-anchor='middle'>says 1</text><text x='40.0' y='770.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>Question: "what is the parity of my edge 1110–1111?" The seven left-to-right edges are copies of that edge.</text><text x='40.0' y='796.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>Without errors they all give the same answer, and no corner sits on two of them,</text><text x='40.0' y='822.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>so each cheater can spoil only one answer. (The eighth copy, 0000–0001, is the empty corner's.)</text><line x1='40' y1='851' x2='70' y2='851' stroke='#2a9d4b' stroke-width='7' stroke-linecap='round'/><text x='80.0' y='857.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>4 clean edges say 1</text><line x1='300' y1='851' x2='330' y2='851' stroke='#d62828' stroke-width='7' stroke-linecap='round'/><text x='340.0' y='857.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>3 edges with a cheater say 0</text><text x='640.0' y='857.0' font-size='20' fill='#222' font-weight='700' text-anchor='start'>Majority: 1</text></svg>