.8' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>0111</text><circle cx='200.0' cy='190.0' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='200.0' y='197.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'></text><text x='164.0' y='175.4' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1000</text><circle cx='704.0' cy='190.0' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='704.0' y='197.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'></text><text x='724.1' y='159.2' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1001</text><circle cx='200.0' cy='694.0' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='200.0' y='701.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'></text><text x='167.4' y='723.8' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1010</text><circle cx='704.0' cy='694.0' r='19' fill='#7fd08f' stroke='#2a9d4b' stroke-width='3.5'/><text x='704.0' y='701.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='719.3' y='737.0' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1011</text><circle cx='467.8' cy='106.9' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='467.8' y='113.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'></text><text x='452.4' y='73.9' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1100</text><circle cx='971.8' cy='106.9' r='19' fill='#7fd08f' stroke='#2a9d4b' stroke-width='3.5'/><text x='971.8' y='113.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='1004.4' y='87.1' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1101</text><circle cx='467.8' cy='610.9' r='19' fill='#7fd08f' stroke='#2a9d4b' stroke-width='3.5'/><text x='467.8' y='617.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='447.7' y='651.7' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1110</text><circle cx='971.8' cy='610.9' r='19' fill='#7fd08f' stroke='#2a9d4b' stroke-width='3.5'/><text x='971.8' y='617.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='1007.7' y='635.6' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1111</text><text x='40.0' y='770.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>Take the four answers out of the picture (flip the corners they account for); what is left at each ringed corner</text><text x='40.0' y='796.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>is just 1111's own bit. Six say 1, the liar at 0111 says 0: corner 1111 = 1.</text><text x='40.0' y='838.0' font-size='18' fill='#222' font-weight='700' text-anchor='start'>Now every secret is one step away: a heavy corner's secret = its edge's answer combined with 1111's bit.</text><rect x='40' y='860' width='200' height='70' rx='8' fill='#5b9bf0' stroke='#d63384' stroke-width='1.5'/><text x='140.0' y='886.0' font-size='17' fill='#666' font-weight='400' text-anchor='middle'>1111</text><text x='140.0' y='916.0' font-size='21' fill='#222' font-weight='700' text-anchor='middle'>its vote = 1</text><rect x='260' y='860' width='200' height='70' rx='8' fill='#5b9bf0' stroke='#d63384' stroke-width='1.5'/><text x='360.0' y='886.0' font-size='17' fill='#666' font-weight='400' text-anchor='middle'>1110</text><text x='360.0' y='916.0' font-size='21' fill='#222' font-weight='700' text-anchor='middle'>1 ⊕ 1 = 0</text><rect x='480' y='860' width='200' height='70' rx='8' fill='#5b9bf0' stroke='#d63384' stroke-width='1.5'/><text x='580.0' y='886.0' font-size='17' fill='#666' font-weight='400' text-anchor='middle'>1101</text><text x='580.0' y='916.0' font-size='21' fill='#222' font-weight='700' text-anchor='middle'>0 ⊕ 1 = 1</text><rect x='700' y='860' width='200' height='70' rx='8' fill='#5b9bf0' stroke='#d63384' stroke-width='1.5'/><text x='800.0' y='886.0' font-size='17' fill='#666' font-weight='400' text-anchor='middle'>1011</text><text x='800.0' y='916.0' font-size='21' fill='#222' font-weight='700' text-anchor='middle'>0 ⊕ 1 = 1</text><rect x='920' y='860' width='200' height='70' rx='8' fill='#5b9bf0' stroke='#d63384' stroke-width='1.5'/><text x='1020.0' y='886.0' font-size='17' fill='#666' font-weight='400' text-anchor='middle'>0111</text><text x='1020.0' y='916.0' font-size='21' fill='#222' font-weight='700' text-anchor='middle'>1 ⊕ 1 = 0</text><text x='40.0' y='970.0' font-size='20' fill='#1e7a39' font-weight='700' text-anchor='start'>Recovered 10110, exactly what was sent, with three of the fifteen seats lying.</text></svg>