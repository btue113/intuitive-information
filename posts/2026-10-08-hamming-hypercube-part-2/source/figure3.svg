.7' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1110</text><circle cx='971.8' cy='610.9' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='971.8' y='617.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='1007.7' y='635.6' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1111</text><polygon points='674.0,140.0 683.0,140.0 678.0,149.0 685.0,149.0 672.0,166.0 677.0,153.0 670.0,153.0' fill='#ffd60a' stroke='#8a6d00' stroke-width='1.2'/><polygon points='562.9,189.0 571.9,189.0 566.9,198.0 573.9,198.0 560.9,215.0 565.9,202.0 558.9,202.0' fill='#ffd60a' stroke='#8a6d00' stroke-width='1.2'/><polygon points='769.9,446.1 778.9,446.1 773.9,455.1 780.9,455.1 767.9,472.1 772.9,459.1 765.9,459.1' fill='#ffd60a' stroke='#8a6d00' stroke-width='1.2'/><circle cx='52' cy='764' r='11' fill='white' stroke='#d62828' stroke-width='3.5'/><text x='72.0' y='770.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>flipped in transit: 0111, 1001, 0100</text><circle cx='52' cy='796' r='11' fill='#f28b8b' stroke='#d63384' stroke-width='2'/><text x='72.0' y='802.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>owns a group that is now odd: 6 of the 10 groups fail, so the magician knows someone lied</text><text x='40.0' y='840.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>Try part 1's trick on the four big groups: those of 1000 and 0010 fail, which spells 1010.</text><text x='40.0' y='866.0' font-size='18' fill='#222' font-weight='700' text-anchor='start'>But 1010 is honest. Only all ten groups together leave a pattern that names the cheaters.</text><text x='40.0' y='900.0' font-size='18' fill='#666' font-weight='400' text-anchor='start'>Received: 101110001000010 (the program's own 3-error test)</text></svg>