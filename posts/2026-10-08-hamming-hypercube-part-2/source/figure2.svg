ext-anchor='middle'>0</text><text x='837.4' y='517.8' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>0111</text><circle cx='200.0' cy='190.0' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='200.0' y='197.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>0</text><text x='164.0' y='175.4' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1000</text><circle cx='704.0' cy='190.0' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='704.0' y='197.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='724.1' y='159.2' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1001</text><circle cx='200.0' cy='694.0' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='200.0' y='701.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>0</text><text x='167.4' y='723.8' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1010</text><circle cx='704.0' cy='694.0' r='19' fill='#5b9bf0' stroke='#d63384' stroke-width='2'/><text x='704.0' y='701.0' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='719.3' y='737.0' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1011</text><circle cx='467.8' cy='106.9' r='19' fill='white' stroke='#d63384' stroke-width='2'/><text x='467.8' y='113.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>0</text><text x='452.4' y='73.9' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1100</text><circle cx='971.8' cy='106.9' r='19' fill='#5b9bf0' stroke='#d63384' stroke-width='2'/><text x='971.8' y='113.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='1004.4' y='87.1' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1101</text><circle cx='467.8' cy='610.9' r='19' fill='#5b9bf0' stroke='#d63384' stroke-width='2'/><text x='467.8' y='617.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>0</text><text x='447.7' y='651.7' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1110</text><circle cx='971.8' cy='610.9' r='19' fill='#5b9bf0' stroke='#d63384' stroke-width='2'/><text x='971.8' y='617.9' font-size='20' fill='#222' font-weight='700' text-anchor='middle'>1</text><text x='1007.7' y='635.6' font-size='15' fill='#666' font-weight='400' text-anchor='middle'>1111</text><text x='40.0' y='770.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>Blue corners hold the five secrets 1, 0, 1, 1, 0 (corners 1111, 1110, 1101, 1011, 0111). Every white corner is a parity bit.</text><line x1='40' y1='796' x2='62' y2='796' stroke='#e9c44a' stroke-width='7' stroke-linecap='round'/><text x='72.0' y='802.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>Group of 1000 = the whole outer cube: its 8 corners hold four 1s, even</text><line x1='40' y1='826' x2='62' y2='826' stroke='#8f7fd6' stroke-width='7' stroke-linecap='round'/><text x='72.0' y='832.0' font-size='18' fill='#222' font-weight='400' text-anchor='start'>Group of 0110 = one square, linking the two cubes: 0110, 0111, 1110, 1111 hold 1+0+0+1 = 2 ones, even</text><text x='40.0' y='866.0' font-size='18' fill='#666' font-weight='400' text-anchor='start'>Each parity corner owns one group: itself plus every corner that has 1s wherever it has 1s.</text><text x='40.0' y='892.0' font-size='18' fill='#666' font-weight='400' text-anchor='start'>4 corners with one 1 own a whole cube (like part 1's faces); 6 corners with two 1s own a square.</text><text x='40.0' y='920.0' font-size='18' fill='#222' font-weight='700' text-anchor='start'>Sent, in the program's order: 101100011000110</text></svg>