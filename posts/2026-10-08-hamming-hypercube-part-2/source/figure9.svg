' y='772' width='76' height='34' rx='6' fill='#f28b8b'/><text x='809.0' y='795.0' font-size='15' fill='#222' font-weight='700' text-anchor='middle'>fail (1)</text><rect x='857.0' y='772' width='76' height='34' rx='6' fill='#7fd08f'/><text x='895.0' y='795.0' font-size='15' fill='#222' font-weight='700' text-anchor='middle'>pass (2)</text><rect x='943.0' y='772' width='76' height='34' rx='6' fill='#f28b8b'/><text x='981.0' y='795.0' font-size='15' fill='#222' font-weight='700' text-anchor='middle'>fail (1)</text><rect x='1029.0' y='772' width='76' height='34' rx='6' fill='#f28b8b'/><text x='1067.0' y='795.0' font-size='15' fill='#222' font-weight='700' text-anchor='middle'>fail (1)</text><text x='40.0' y='842.0' font-size='17' fill='#666' font-weight='400' text-anchor='start'>(n) = how many cheaters sit in the group. Two cheaters in the same group cancel out, which is why part 1 broke.</text><text x='40.0' y='870.0' font-size='17' fill='#222' font-weight='700' text-anchor='start'>But no other set of three or fewer seats leaves this exact pattern: checked for all 576 possible sets.</text></svg>