{{ define "main" }}
<div class="home">
  <h1>{{ .Title }}</h1>
  <p class="sub">{{ .Description }}</p>
  <div class="sections">{{ .Content }}</div>
  {{ with (where site.RegularPages "Section" "intuitive-information").ByDate.Reverse }}
  <details class="recent" open>
    <summary>Recent writing <span class="count">({{ len . }})</span></summary>
    {{ partial "postlist.html" . }}
  </details>
  {{ end }}
</div>
{{ end }}
