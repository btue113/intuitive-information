<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
  <meta name="author" content="{{ site.Params.author }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ site.Title }}">
  {{ if .IsPage }}<meta property="og:type" content="article">{{ with .Resources.GetMatch "figures/figure1.png" }}<meta property="og:image" content="{{ .Permalink }}">{{ end }}{{ end }}
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ "" | relURL }}">{{ site.Title }}</a>
    <nav><a href="{{ "series/" | relURL }}">Series</a> <a href="{{ "index.xml" | relURL }}">RSS</a></nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer class="site">© {{ now.Year }} {{ site.Params.author }}</footer>
</body>
</html>
